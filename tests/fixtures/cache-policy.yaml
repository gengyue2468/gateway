version: 1
ingress:
  - hostname: cache-policy.example
    path: ^/public$
    service: http://origin:8080
    cache:
      ttl: 30m
      stale: 45s
      default_cache_control: "public, max-age=60"
      max_cacheable_body_bytes: 65536
      sort_query: false
    health:
      active: false
  - service: http_status:444
