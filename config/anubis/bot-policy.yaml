bots:
  - name: umami-script
    expression: 'host == "u.gy.run" && path == "/script.js" && size(query) == 0'
    action: ALLOW

  - name: komari-manifest
    expression: 'host == "v-ps.net" && path == "/manifest.json" && size(query) == 0'
    action: ALLOW

  - name: komari-favicon
    expression: 'host == "v-ps.net" && path == "/favicon.ico" && size(query) == 0'
    action: ALLOW

  - import: (data)/bots/_deny-pathological.yaml
  - import: (data)/bots/headless-browsers.yaml
  - import: (data)/meta/ai-block-aggressive.yaml
  - name: www-non-read
    expression: 'host == "www.gengyue.dev" && method != "GET" && method != "HEAD"'
    action: DENY

  - name: www-tty-or-query
    expression: 'host == "www.gengyue.dev" && (method == "GET" || method == "HEAD") && (path == "/tty" || path.startsWith("/tty/") || size(query) > 0)'
    action: CHALLENGE

  - name: www-public-read
    expression: 'host == "www.gengyue.dev" && (method == "GET" || method == "HEAD") && path != "/tty" && !path.startsWith("/tty/") && size(query) == 0'
    action: ALLOW

  - import: (data)/crawlers/_allow-good.yaml

  - name: generic-browser
    user_agent_regex: >-
      Mozilla|Opera
    action: WEIGH
    weight:
      # Keep the default browser path in the challenge pipeline, but below
      # the medium-risk threshold so ordinary browsers get a light check.
      adjust: 5

thresholds:
  - name: minimal-suspicion
    expression: weight <= 0
    action: CHALLENGE
    challenge:
      algorithm: fast
      # entrypoint.sh replaces this with ANUBIS_DIFFICULTY.
      difficulty: __ANUBIS_BASE_DIFFICULTY__

  - name: mild-suspicion
    expression:
      all:
        - weight > 0
        - weight < 10
    action: CHALLENGE
    challenge:
      algorithm: fast
      # entrypoint.sh replaces this with ANUBIS_DIFFICULTY.
      difficulty: __ANUBIS_BASE_DIFFICULTY__

  - name: moderate-suspicion
    expression:
      all:
        - weight >= 10
        - weight < 20
    action: CHALLENGE
    challenge:
      algorithm: fast
      # entrypoint.sh replaces this with ANUBIS_DIFFICULTY + 1.
      difficulty: __ANUBIS_MODERATE_DIFFICULTY__

  - name: high-suspicion
    expression:
      all:
        - weight >= 20
        - weight < 30
    action: CHALLENGE
    challenge:
      algorithm: fast
      # entrypoint.sh replaces this with ANUBIS_DIFFICULTY + 2.
      difficulty: __ANUBIS_HIGH_RISK_DIFFICULTY__

  - name: extreme-suspicion
    expression:
      all:
        - weight >= 30
        - weight < 40
    action: CHALLENGE
    challenge:
      algorithm: fast
      # entrypoint.sh replaces this with ANUBIS_DIFFICULTY + 3.
      difficulty: __ANUBIS_EXTREME_DIFFICULTY__

  - name: block-extreme-suspicion
    expression: weight >= 40
    action: DENY

store:
  backend: bbolt
  parameters:
    path: /data/anubis/anubis.bdb

status_codes:
  CHALLENGE: 200
  DENY: 200

honeypot:
  enabled: true
  implementation: naive

logging:
  sink: stdio
  level: INFO
