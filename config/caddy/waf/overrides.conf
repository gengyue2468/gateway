# Add narrowly scoped CRS exclusions here.
# Keep the CRS rules enabled and prefer removing individual rule IDs.
# Memos gRPC-Web sends protobuf bodies with application/proto and binary field
# names. CRS protocol rules 920420 and 921150 misclassify those bytes; remove
# only those two checks for the Memos gRPC endpoint prefix.
SecRule REQUEST_URI "@rx ^/memos[.]api[.]v1[.]" "id:1001001,phase:1,pass,nolog,ctl:ruleRemoveById=920420,ctl:ruleRemoveById=921150"

# Komari agents send compressed protocol bodies to the client RPC endpoint.
# Keep the edge WAF active, but skip only the generic content-encoding warning
# and JSON parser failure for this one host and endpoint family.
SecRule REQUEST_HEADERS:Host "@rx ^st[.]gy[.]run(?::[0-9]+)?$" "id:1001002,phase:1,pass,nolog,chain,ctl:ruleRemoveById=920450,ctl:ruleRemoveById=200002"
    SecRule REQUEST_URI "@rx ^/api/clients(/|$)"
