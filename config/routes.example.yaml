# yaml-language-server: $schema=./routes.schema.json
version: 1

ingress:
  # WebSocket paths that cannot pass through Anubis can bypass the challenge
  # and edge Coraza/WAF, going directly from edge Caddy to the declared
  # upstream. The route rate limit still runs before this proxy. Bypass routes
  # may also use rewrite, load_balance, and an explicit health configuration.
  - hostname: terminal.your-domain.example
    path: ^/tty(/.*)?$
    service: https://origin.example.com
    cache: false
    methods: [GET]
    bypass_anubis: true
    rate_limit:
      name: terminal_per_client
      key: "{remote_host}"
      window: 1m
      events: 60
      methods: [GET]
      ipv6_prefix: 64

  # redirect is a normal HTTP 302; no status field is needed.
  - hostname: old.your-domain.example
    redirect: https://your-domain.example{uri}

  # rewrite changes the URI internally before proxying.
  - hostname: your-domain.example
    path: ^/legacy(/.*)?$
    rewrite: /new{uri}
    service: https://origin.example.com

  # meta_redirect is intentionally explicit and browser-only.
  - hostname: browser.your-domain.example
    meta_redirect: https://your-domain.example/

  - hostname: your-domain.example
    service: https://origin.example.com
    # Cache is opt-in and is only safe for public responses. The full query
    # remains in the cache key; sort_query is rejected with cache-handler 0.16.
    cache:
      ttl: 4h
      stale: 30s
      default_cache_control: "public, max-age=14400"
      max_cacheable_body_bytes: 1048576
      sort_query: false
    health:
      uri: /

  # A route without hostname is backend-only. It is evaluated by the origin
  # Caddy after Anubis and cannot use bypass_anubis.
  - path: ^/backend-only(/.*)?$
    service: https://origin.example.com

  # Set active: false when the upstream has no health endpoint.
  - hostname: shortlinks.your-domain.example
    service: https://shortlinks.example.com
    health:
      active: false

  - service: http_status:444
